apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: nestjs-base
data:
  NODE_ENV: 'production'
  LOCAL: 'LOCAL'
  APP_PORT: '8080'
  APP_NAME: 'nestjs-base'
  SALT_ROUND: '10'
  JWT_EXPIRATION: '900s'
  DB_TYPE: 'mongodb'
  MIN_POOL_SIZE: '1'
  MAX_POOL_SIZE: '10'
  MONGO_DB_NAME: 'localAuth'
  # No cache server in this setup, so the in-process driver. Switch to redis
  # or valkey here and add the matching URL to secret.yaml.
  CACHE_DRIVER: 'memory'
  CACHE_TTL: '3600'
  # Domain a SIWE signature must be bound to. Empty means the check is off —
  # set it before exposing SIWE login. Nothing wires SiweService yet.
  APP_DOMAIN: ''
  # No provider wired here, so mail is logged rather than sent. Point this at
  # ses or sendgrid and add the credentials to secret.yaml.
  MAIL_DRIVER: 'log'
  MAIL_FROM: 'no-reply@example.com'
