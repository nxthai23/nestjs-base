apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: nestjs-base
data:
  NODE_ENV: 'production'
  LOCAL: 'LOCAL'
  APP_PORT: '8080'
  APP_NAME: 'nestjs-base'
  SALT_ROUND: '10'
  JWT_EXPIRATION: '900s'
  DB_TYPE: 'mongodb'
  MIN_POOL_SIZE: '1'
  MAX_POOL_SIZE: '10'
  MONGO_DB_NAME: 'localAuth'
  REDIS_TTL: '3600'
  REDIS_TYPE: 'single'
