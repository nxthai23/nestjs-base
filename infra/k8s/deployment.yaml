apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-base
  namespace: nestjs-base
  labels:
    app: nestjs-base
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: nestjs-base
  template:
    metadata:
      labels:
        app: nestjs-base
    spec:
      securityContext:
        runAsNonRoot: true
        # distroless nonroot images run as UID/GID 65532 but the user is a
        # name, not a number, in the image config — kubelet can't verify
        # runAsNonRoot from that alone, so pin the numeric UID explicitly.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nestjs-base
          image: nestjs-base:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          resources:
            requests: { memory: '128Mi', cpu: '100m' }
            limits: { memory: '512Mi', cpu: '500m' }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
