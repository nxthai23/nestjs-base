# Template only — copy to secret.yaml (git-ignored) and fill in real values
# before applying, or generate it imperatively instead:
#   kubectl create secret generic app-secret -n nestjs-base \
#     --from-literal=JWT_SECRET=<value> \
#     --from-literal=MONGO_URI='mongodb://mongo.nestjs-base.svc.cluster.local:27017/?readPreference=primary&directConnection=true&ssl=false'
#
# REDIS_URL and the POSTGRES_* vars are omitted here: this base setup targets
# mongodb (DB_TYPE=mongodb) with no Redis, matching docker-compose.yml. Add
# them back with --from-literal if you switch DB_TYPE or wire up Redis.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: nestjs-base
type: Opaque
stringData:
  JWT_SECRET: 'change-me'
  MONGO_URI: 'mongodb://mongo.nestjs-base.svc.cluster.local:27017/?readPreference=primary&directConnection=true&ssl=false'
