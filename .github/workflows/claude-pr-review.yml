name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev

jobs:
  claude-review:
    name: Claude code review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's own token instead of the Claude GitHub App,
          # which isn't installed on this repo/org.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Surface the review in the Action's own Step Summary instead of
          # posting a PR comment.
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.
            Use `gh pr diff` / `gh pr view` (read-only) to inspect the change if needed.

            Do NOT post anything to GitHub - no PR comments, no inline review
            comments. Just report your findings in your final response; it
            will be shown in the workflow's Step Summary.

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"
